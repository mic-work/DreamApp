<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>DreamApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="DreamApp: le vostre liste dei desideri, sempre a portata di mano.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- PWA / manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e2607d">

  <!-- Fredoka: display font used by the Home page's "Holographic" redesign -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">

  <!-- iOS "Add to Home Screen" support (Safari does not read manifest.webmanifest for these) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DreamApp">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <app-root></app-root>
  <noscript>DreamApp richiede JavaScript per funzionare.</noscript>
</body>
</html>
