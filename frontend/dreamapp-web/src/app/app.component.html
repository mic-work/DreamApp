<main class="app-main" [class.with-nav]="authService.isAuthenticated()">
  <router-outlet />
</main>

@if (authService.isAuthenticated()) {
  <nav class="bottom-nav" aria-label="Navigazione principale">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
      <span class="nav-icon"><app-icon name="home" [size]="22" /></span>
      <span class="nav-label">Home</span>
    </a>
    <a routerLink="/wishlist/me" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
      <span class="nav-icon"><app-icon name="gift" [size]="22" /></span>
      <span class="nav-label">Desideri</span>
    </a>
    <a routerLink="/profile" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
      <span class="nav-icon"><app-icon name="user" [size]="22" /></span>
      <span class="nav-label">Profilo</span>
    </a>
  </nav>
}
