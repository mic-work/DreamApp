<div class="page">
  <app-page-header [title]="wishlist ? 'Lista di ' + wishlist.ownerUsername : 'Lista desideri'" backTo="/home" />

  @if (loading) {
    <div class="empty-state"><span class="spinner spinner-dark"></span></div>
  } @else if (errorMessage) {
    <div class="alert alert-error">{{ errorMessage }}</div>
  } @else if (wishlist) {
    @if (wishlist.gifts.length === 0) {
      <p class="empty-state">{{ wishlist.ownerUsername }} non ha ancora aggiunto desideri.</p>
    } @else {
      <div class="card-list">
        @for (gift of wishlist.gifts; track gift.id) {
          <app-gift-card [gift]="gift" />
        }
      </div>
    }
  }
</div>
