<a class="card gift-row" [routerLink]="giftRoute">
  <span
    class="gift-icon"
    [class.prio-high]="gift.priority === 'High'"
    [class.prio-medium]="gift.priority === 'Medium'"
    [class.prio-low]="gift.priority === 'Low'"
  >
    <app-icon name="gift" [size]="22" />
  </span>
  <div class="gift-row-info">
    <h3>{{ gift.name }}</h3>
    <div class="gift-row-badges">
      <app-priority-badge [priority]="gift.priority" [holo]="true" />
      @if (!gift.isOwner && gift.myClaimPending) {
        <span class="pending-badge">In attesa di conferma</span>
      }
      @if (gift.isOwner && gift.claimedByUserIds.length > 0) {
        <span class="claim-alert-badge">Un amico ha segnalato questo regalo</span>
      }
    </div>
  </div>
  <app-icon name="chevron-right" [size]="18" class="chevron" />
</a>
