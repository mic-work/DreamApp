<span class="badge" [class]="'priority-' + priority.toLowerCase()" [class.holo]="holo">
  <span class="stars" aria-hidden="true">
    @for (star of stars; track $index) {
      <app-icon name="star-filled" [size]="12" />
    }
  </span>
  <span>{{ holo ? 'Priorità ' + label.toLowerCase() : label }}</span>
</span>
