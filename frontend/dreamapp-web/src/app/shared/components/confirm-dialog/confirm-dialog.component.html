@if (open) {
  <div class="overlay" (click)="cancelled.emit()">
    <div class="dialog" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
      <h2>{{ title }}</h2>
      @if (message) {
        <p>{{ message }}</p>
      }
      <div class="actions">
        <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">{{ cancelLabel }}</button>
        <button type="button" class="btn btn-danger" (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
}
