name: Deploy Frontend to GitHub Pages

# Builds the Angular/PWA frontend and publishes it to GitHub Pages.
# The ASP.NET Core backend is NOT built or deployed here: GitHub Pages only
# ever serves the static frontend (see section 27 of docs/architecture.md).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dreamapp-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dreamapp-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build (production, base href = /<repo-name>/)
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback for GitHub Pages (client-side routing on refresh)
        run: cp dist/dreamapp-web/browser/index.html dist/dreamapp-web/browser/404.html

      - name: Disable Jekyll processing
        run: touch dist/dreamapp-web/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dreamapp-web/dist/dreamapp-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
